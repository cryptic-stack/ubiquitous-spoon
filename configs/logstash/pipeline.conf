input {
  file {
    id => "sentinelmesh-suricata-eve"
    path => "/logs/suricata/eve.json"
    start_position => "beginning"
    sincedb_path => "/tmp/sentinelmesh-suricata.sincedb"
    codec => "json"
    add_field => {
      "[event][module]" => "suricata"
      "[event][dataset]" => "suricata.eve"
      "[sentinelmesh][ingest_source]" => "suricata-eve"
    }
  }

  file {
    id => "sentinelmesh-zeek-json"
    path => "/logs/zeek/current/*.json"
    start_position => "beginning"
    sincedb_path => "/tmp/sentinelmesh-zeek.sincedb"
    codec => "json"
    add_field => {
      "[event][module]" => "zeek"
      "[event][dataset]" => "zeek.json"
      "[sentinelmesh][ingest_source]" => "zeek-json"
    }
  }

  redis {
    id => "sentinelmesh-redis-events"
    host => "redis"
    data_type => "list"
    key => "sentinelmesh-events"
    codec => "json"
    add_field => {
      "[sentinelmesh][ingest_source]" => "redis"
    }
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "UNIX", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ"]
      target => "@timestamp"
    }
  }

  if [ts] {
    date {
      match => ["ts", "UNIX", "ISO8601"]
      target => "@timestamp"
    }
  }

  if [src_ip] and ![source][ip] {
    mutate {
      add_field => { "[source][ip]" => "%{[src_ip]}" }
    }
  }

  if [dest_ip] and ![destination][ip] {
    mutate {
      add_field => { "[destination][ip]" => "%{[dest_ip]}" }
    }
  }

  if [id.orig_h] and ![source][ip] {
    mutate {
      add_field => { "[source][ip]" => "%{[id.orig_h]}" }
    }
  }

  if [id.resp_h] and ![destination][ip] {
    mutate {
      add_field => { "[destination][ip]" => "%{[id.resp_h]}" }
    }
  }

  mutate {
    add_field => {
      "[sentinelmesh][enriched]" => "false"
      "[sentinelmesh][pipeline]" => "logstash-mvp-v1"
    }
  }
}

output {
  stdout {
    codec => json_lines
  }

  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "sentinelmesh-events-%{+YYYY.MM.dd}"
  }
}
