global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: connection-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - connection-metrics:9105

  - job_name: asset-context
    metrics_path: /metrics
    static_configs:
      - targets:
          - connection-metrics:9105
    relabel_configs:
      - target_label: sentinelmesh_source
        replacement: asset-context-derived

  - job_name: soc-portal
    metrics_path: /metrics
    static_configs:
      - targets:
          - soc:8080
