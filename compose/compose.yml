name: sentinelmesh

services:
  suricata:
    image: jasonish/suricata:latest
    container_name: sm-suricata
    profiles: ["standalone", "sensor", "cyber-range"]
    network_mode: host
    command: ["-i", "${SENTINELMESH_MONITOR_INTERFACE:-eth1}"]
    volumes:
      - ../rules/suricata:/etc/suricata/rules:ro
      - sentinelmesh-suricata:/var/log/suricata

  zeek:
    image: zeek/zeek:latest
    container_name: sm-zeek
    profiles: ["standalone", "sensor", "cyber-range"]
    network_mode: host
    command: ["zeek", "-i", "${SENTINELMESH_MONITOR_INTERFACE:-eth1}"]
    volumes:
      - sentinelmesh-zeek:/usr/local/zeek/logs

  arkime:
    image: alpine:latest
    container_name: sm-arkime
    profiles: ["standalone", "sensor", "cyber-range"]
    network_mode: host
    command: ["sh", "-c", "while true; do echo sentinelmesh arkime placeholder; sleep 300; done"]
    volumes:
      - ../configs/arkime:/opt/sentinelmesh/configs/arkime:ro
      - sentinelmesh-arkime:/data/arkime

  stenographer:
    image: alpine:latest
    container_name: sm-stenographer
    profiles: ["standalone", "sensor", "cyber-range"]
    network_mode: host
    command: ["sh", "-c", "while true; do echo sentinelmesh stenographer placeholder; sleep 300; done"]
    volumes:
      - ../configs/stenographer:/opt/sentinelmesh/configs/stenographer:ro
      - sentinelmesh-pcap:/data/pcap

  vector:
    image: timberio/vector:latest-alpine
    container_name: sm-vector
    profiles: ["standalone", "manager", "sensor", "cyber-range", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - vector
    volumes:
      - ../configs/vector:/etc/vector:ro
      - sentinelmesh-suricata:/logs/suricata:ro
      - sentinelmesh-zeek:/logs/zeek:ro

  redis:
    image: redis:7-alpine
    container_name: sm-redis
    profiles: ["standalone", "manager", "receiver", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - redis
    volumes:
      - sentinelmesh-redis:/data

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: sm-logstash
    profiles: ["standalone", "manager", "receiver", "search", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - logstash
    volumes:
      - ../configs/logstash:/usr/share/logstash/pipeline:ro
      - sentinelmesh-suricata:/logs/suricata:ro
      - sentinelmesh-zeek:/logs/zeek:ro

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: sm-opensearch
    profiles: ["standalone", "manager", "manager-search", "search", "cyber-range", "dev-lab"]
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ChangeMe-SentinelMesh-DevOnly-123!}"
      plugins.security.disabled: "true"
    networks:
      smbridge:
        aliases:
          - opensearch
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - sentinelmesh-opensearch:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: sm-dashboards
    profiles: ["standalone", "manager", "manager-search", "cyber-range", "dev-lab"]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      smbridge:
        aliases:
          - dashboards
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      - opensearch

  soc-portal:
    image: python:3.12-slim
    container_name: sm-soc
    profiles: ["standalone", "manager", "manager-search", "cyber-range", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - soc
    environment:
      SENTINELMESH_SOC_PORT: "8080"
      SENTINELMESH_SOC_STATIC_DIR: "/portal"
      SENTINELMESH_OPENSEARCH_URL: "${SENTINELMESH_OPENSEARCH_URL:-http://opensearch:9200}"
      SENTINELMESH_EVENT_INDEX_PATTERN: "${SENTINELMESH_EVENT_INDEX_PATTERN:-sentinelmesh-events-*}"
      SENTINELMESH_ASSET_SEED_PATH: "/seeds/sample-assets.json"
    ports:
      - "${SOC_PORTAL_PORT:-8080}:8080"
    volumes:
      - ../services/soc-portal:/app:ro
      - ../configs/portal:/portal:ro
      - ../services/asset-context/sample-assets.json:/seeds/sample-assets.json:ro
    command: ["python", "/app/soc_portal.py"]
    depends_on:
      - opensearch

  asset-context:
    image: python:3.12-slim
    container_name: sm-asset-context
    profiles: ["standalone", "manager", "manager-search", "cyber-range", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - asset-context
    environment:
      SENTINELMESH_ASSET_INDEX: "${SENTINELMESH_ASSET_INDEX:-sentinelmesh-assets}"
      SENTINELMESH_EVENT_INDEX_PATTERN: "${SENTINELMESH_EVENT_INDEX_PATTERN:-sentinelmesh-events-*}"
      SENTINELMESH_OPENSEARCH_URL: "${SENTINELMESH_OPENSEARCH_URL:-http://opensearch:9200}"
      SENTINELMESH_RISK_MODEL: "${SENTINELMESH_RISK_MODEL:-mvp-v1}"
      SENTINELMESH_ASSET_SEED_PATH: "${SENTINELMESH_ASSET_SEED_PATH:-/app/sample-assets.json}"
    command: ["python", "/app/asset_context.py"]
    volumes:
      - ../services/asset-context:/app:ro
      - ../schemas:/schemas:ro
    depends_on:
      - opensearch

  sensor-enrollment:
    image: python:3.12-slim
    container_name: sm-sensor-enrollment
    profiles: ["standalone", "manager", "manager-search", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - sensor-enrollment
    environment:
      SENTINELMESH_ENROLLMENT_DIR: "${SENTINELMESH_ENROLLMENT_DIR:-/enrollment}"
      SENTINELMESH_ENROLLMENT_INTERVAL: "${SENTINELMESH_ENROLLMENT_INTERVAL:-300}"
    command: ["python", "/app/enrollment_service.py"]
    volumes:
      - ../services/sensor-enrollment:/app:ro
      - sentinelmesh-enrollment:/enrollment

  connection-metrics:
    image: python:3.12-slim
    container_name: sm-connection-metrics
    profiles: ["standalone", "manager", "manager-search", "cyber-range", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - connection-metrics
    environment:
      SENTINELMESH_CONNECTION_METRICS_PORT: "${SENTINELMESH_CONNECTION_METRICS_PORT:-9105}"
      SENTINELMESH_ASSET_SEED_PATH: "${SENTINELMESH_ASSET_SEED_PATH:-/seeds/sample-assets.json}"
      SENTINELMESH_CONNECTION_SEED_PATH: "${SENTINELMESH_CONNECTION_SEED_PATH:-/app/sample-connections.json}"
    ports:
      - "${CONNECTION_METRICS_PORT:-9105}:9105"
    command: ["python", "/app/connection_metrics.py"]
    volumes:
      - ../services/connection-metrics:/app:ro
      - ../services/asset-context/sample-assets.json:/seeds/sample-assets.json:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: sm-prometheus
    profiles: ["standalone", "manager", "manager-search", "cyber-range", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sentinelmesh-prometheus:/prometheus
    depends_on:
      - connection-metrics

  grafana:
    image: grafana/grafana:latest
    container_name: sm-grafana
    profiles: ["standalone", "manager", "manager-search", "cyber-range", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-sentinelmesh}"
      GF_INSTALL_PLUGINS: "marcusolsson-json-datasource"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - sentinelmesh-grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - connection-metrics

  range-engine:
    image: python:3.12-slim
    container_name: sm-range-engine
    profiles: ["cyber-range", "dev-lab"]
    networks:
      smbridge:
        aliases:
          - range-engine
    environment:
      SENTINELMESH_RANGE_SCENARIO_DIR: "${SENTINELMESH_RANGE_SCENARIO_DIR:-/scenarios/range}"
      SENTINELMESH_RANGE_INTERVAL: "${SENTINELMESH_RANGE_INTERVAL:-300}"
    command: ["python", "/app/range_engine.py"]
    volumes:
      - ../services/range-engine:/app:ro
      - ../scenarios:/scenarios:ro

networks:
  smbridge:
    name: smbridge

volumes:
  sentinelmesh-suricata:
  sentinelmesh-zeek:
  sentinelmesh-arkime:
  sentinelmesh-pcap:
  sentinelmesh-opensearch:
  sentinelmesh-redis:
  sentinelmesh-enrollment:
  sentinelmesh-prometheus:
  sentinelmesh-grafana:
